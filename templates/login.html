{% extends "base.html" %}
{% block title %}Login - PocketSmart AI{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>Welcome back</h1>
  {% if success %}<div class="alert success" role="status">{{ success }}</div>{% endif %}
  {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form">
    <label>Username
      <input name="username" required value="{{ form.username if form else '' }}" autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Login</button>
  </form>
  <p class="muted">New here? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
