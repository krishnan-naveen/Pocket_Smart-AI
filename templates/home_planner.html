{% extends "base.html" %}
{% block title %}Home Interior Planner - PocketSmart AI{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>🛋️ Home Interior Planner</h1>
  <p class="muted">Tell us about the room and your budget.</p>
  <div id="form-error" class="alert error" role="alert" hidden></div>
  <form class="form planner-form" data-endpoint="/generate-home" data-mode="json">
    <label>Room
      <select name="room" required>
        {% for r in rooms %}<option value="{{ r }}">{{ r | title }}</option>{% endfor %}
      </select>
    </label>
    <label>Style
      <select name="style">
        {% for s in styles %}<option value="{{ s }}">{{ s | title }}</option>{% endfor %}
      </select>
    </label>
    <label>Number of rooms (quantity)
      <input type="number" name="quantity" min="1" max="5" value="1" required>
    </label>
    <label>Total budget (₹)
      <input type="number" name="budget" min="500" max="10000000" step="100" placeholder="e.g. 50000" required>
    </label>
    <label>Anything else? (optional)
      <textarea name="notes" maxlength="500" rows="3" placeholder="e.g. small room, need storage"></textarea>
    </label>
    <button class="btn" type="submit">Get recommendations</button>
  </form>
  <div class="loading" hidden>Asking Gemini... this can take up to 20 seconds.</div>
</div>
{% endblock %}
